<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auction Draft Board</title>
<style>
  :root{
    --bg:#0f1720; --panel:#17212b; --panel2:#1c2833; --border:#2a3846;
    --text:#e8eef4; --sub:#8fa3b3; --accent:#3fa9f5;
    --green:#33c17a; --amber:#e0a72e; --red:#e0554f;
    --qb:#e0459e; --rb:#33c17a; --wr:#e8c547; --te:#9b6bdb; --pk:#c9752e; --def:#3fa9f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:11px;
  }
  header{
    position:sticky; top:0; z-index:30; background:var(--panel);
    border-bottom:1px solid var(--border); padding:8px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:14px; margin:0; font-weight:700; letter-spacing:.2px;}
  header h1 span{color:var(--sub); font-weight:400; font-size:11px; margin-left:6px;}
  .stats{display:flex; gap:14px; font-size:10.5px; color:var(--sub); flex-wrap:wrap;}
  .stats b{color:var(--text); font-size:11.5px;}
  .btns{display:flex; gap:6px;}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.danger:hover{border-color:var(--red); color:var(--red);}
  .board-wrap{overflow:auto; padding:10px; max-width:100vw;}
  table{border-collapse:separate; border-spacing:0; width:max-content;}
  th,td{border:1px solid var(--border);}
  thead th{
    position:sticky; top:0; background:var(--panel); z-index:20;
    padding:0; vertical-align:top;
  }
  .pickcol{
    position:sticky; left:0; z-index:15; background:var(--panel2);
    min-width:36px; max-width:36px; text-align:center; color:var(--sub);
    font-weight:600; font-size:9.5px;
  }
  thead .pickcol{z-index:25;}
  .team-head{padding:5px 5px 6px; min-width:118px;}
  .team-head input.team-name{
    width:100%; background:transparent; border:none; color:var(--text);
    font-weight:700; font-size:11.5px; padding:1px 2px; border-bottom:1px dashed transparent;
    cursor:text; border-radius:3px;
  }
  .team-head input.team-name:hover{background:rgba(255,255,255,.06); border-bottom:1px dashed var(--sub);}
  .team-head input.team-name:focus{outline:none; background:rgba(63,169,245,.08); border-bottom:1px dashed var(--accent);}
  .team-head input.team-name::placeholder{color:var(--sub); font-weight:400;}
  .budget-line{display:flex; align-items:baseline; justify-content:space-between; margin-top:2px;}
  .budget-amt{font-size:14px; font-weight:800;}
  .budget-sub{font-size:8.5px; color:var(--sub); margin-top:1px; display:flex; justify-content:space-between;}
  .bar{height:3px; border-radius:3px; background:#0b1119; margin-top:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--green); transition:width .2s;}
  .cell{padding:2px; min-width:118px; vertical-align:top; background:var(--panel2); transition:background .15s;}
  .cell.filled{background:#1a2530;}
  .cell.cell-QB{background:rgba(224,69,158,.38); box-shadow:inset 0 0 0 1px var(--qb);}
  .cell.cell-RB{background:rgba(51,193,122,.38); box-shadow:inset 0 0 0 1px var(--rb);}
  .cell.cell-WR{background:rgba(232,197,71,.34); box-shadow:inset 0 0 0 1px var(--wr);}
  .cell.cell-TE{background:rgba(155,107,219,.36); box-shadow:inset 0 0 0 1px var(--te);}
  .cell.cell-PK{background:rgba(201,117,46,.36); box-shadow:inset 0 0 0 1px var(--pk);}
  .cell.cell-DEF{background:rgba(63,169,245,.34); box-shadow:inset 0 0 0 1px var(--def);}
  .cell.dup{background:#3a1c1c !important; box-shadow:inset 0 0 0 1px var(--red) !important;}
  .cell-inner{display:flex; gap:3px; align-items:center;}
  .player-wrap{position:relative; flex:1;}
  input.player-input{
    width:100%; background:#0f1720; border:1px solid var(--border); color:var(--text);
    padding:4px 5px; border-radius:4px; font-size:10.5px;
  }
  input.player-input:focus{outline:none; border-color:var(--accent);}
  .pos-badge{
    display:inline-block; font-size:8px; font-weight:800; color:#0b1119;
    border-radius:3px; padding:1px 3px; margin-right:3px; vertical-align:middle;
  }
  .pos-QB{background:var(--qb);} .pos-RB{background:var(--rb);} .pos-WR{background:var(--wr);}
  .pos-TE{background:var(--te);} .pos-PK{background:var(--pk);} .pos-DEF{background:var(--def);}
  input.price-input{
    width:40px; background:#0f1720; border:1px solid var(--border); color:var(--text);
    padding:4px 3px; border-radius:4px; font-size:10.5px; text-align:right;
  }
  input.price-input:focus{outline:none; border-color:var(--accent);}
  .clear-x{
    background:none; border:none; color:var(--sub); font-size:12px; cursor:pointer;
    padding:0 1px; line-height:1;
  }
  .clear-x:hover{color:var(--red);}
  #suggest-panel{
    position:fixed; z-index:100; background:#101820; border:1px solid var(--accent);
    border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); max-height:280px; overflow-y:auto;
    display:none; min-width:230px;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .sg-item{
    padding:6px 9px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:11px;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(63,169,245,.25);
  }
  .sg-item:hover, .sg-item.active{background:#1c2833;}
  .sg-item.taken{opacity:.4; cursor:not-allowed;}
  .sg-name{flex:1;}
  .sg-meta{color:var(--sub); font-size:9.5px;}
  .sg-empty{padding:8px 9px; color:var(--sub); font-size:11px;}
  footer{padding:8px 12px 24px; color:var(--sub); font-size:10px;}
  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-10px);
    background:#2a1414; border:1px solid var(--red); color:#ffd9d6; padding:8px 14px;
    border-radius:7px; font-size:12px; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Larger touch targets on phones/tablets so taps land accurately */
  @media (max-width: 900px), (pointer: coarse){
    .sg-item{padding:11px 12px; font-size:13px; gap:8px;}
    .sg-meta{font-size:11px;}
    .sg-empty{padding:12px;}
    .pos-badge{font-size:9.5px; padding:2px 5px;}
    input.player-input{padding:8px 8px; font-size:12.5px;}
    input.price-input{padding:8px 5px; font-size:12.5px; width:46px;}
    .clear-x{font-size:16px; padding:4px 6px; touch-action:manipulation;}
    .team-head input.team-name{padding:6px 4px; font-size:12.5px;}
  }
</style>
</head>
<body>

<header>
  <h1>Auction Draft Board <span>12 Teams &middot; $300 Budget &middot; Live</span></h1>
  <div class="stats">
    <div>Drafted: <b id="stat-drafted">0</b> / 180</div>
    <div>League $ Spent: <b id="stat-spent">$0</b></div>
    <div>Avg Price: <b id="stat-avg">$0</b></div>
    <div>Pool Remaining: <b id="stat-pool">228</b></div>
  </div>
  <div class="btns">
    <button id="btn-export">Export CSV</button>
    <button id="btn-reset" class="danger">Reset Board</button>
  </div>
</header>

<div class="board-wrap">
  <table id="board">
    <thead>
      <tr id="head-row">
        <th class="pickcol">Pick</th>
      </tr>
    </thead>
    <tbody id="board-body"></tbody>
  </table>
</div>

<footer>
  Data auto-saves to this browser. Type a player name to search; click a match or press Enter to select. Duplicate player names across the board are flagged in red.
</footer>

<div id="suggest-panel"></div>
<div id="toast"></div>

  const STORAGE_KEY = 'auctionDraftBoard_v1';
  const POS_LIST = ['QB','RB','WR','TE','PK','DEF'];

  function defaultState(){
    return {
      teams: Array.from({length:NUM_TEAMS}, (_,i)=>({name:'Team ' + (i+1)})),
      picks: Array.from({length:NUM_PICKS}, ()=>Array.from({length:NUM_TEAMS}, ()=>({player:'',pos:'',team:'',price:''})))
    };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const base = defaultState();
      if(Array.isArray(parsed.teams)){
        for(let i=0;i<NUM_TEAMS;i++){
          if(parsed.teams[i] && typeof parsed.teams[i].name === 'string') base.teams[i].name = parsed.teams[i].name;
        }
      }
      if(Array.isArray(parsed.picks)){
        for(let r=0;r<NUM_PICKS;r++){
          for(let c=0;c<NUM_TEAMS;c++){
            const p = parsed.picks[r] && parsed.picks[r][c];
            if(p) base.picks[r][c] = {player:p.player||'', pos:p.pos||'', team:p.team||'', price:p.price===0?0:(p.price||'')};
          }
        }
      }
      return base;
    }catch(e){
      console.warn('Failed to load saved board, starting fresh.', e);
      return defaultState();
    }
  }

  let state = loadState();
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  // ---------- build header ----------
  const headRow = document.getElementById('head-row');
  const teamNameInputs = [];
  const budgetAmtEls = [];
  const budgetSubEls = [];
  const barFillEls = [];

  for(let c=0;c<NUM_TEAMS;c++){
    const th = document.createElement('th');
    th.className = 'team-head';
    th.innerHTML = `
      <input class="team-name" data-c="${c}" maxlength="24" spellcheck="false" placeholder="Team name..." title="Click to rename this team — editable anytime">
      <div class="budget-line"><span class="budget-amt">$300</span></div>
      <div class="budget-sub"><span class="filled-count">0/15 filled</span><span class="max-bid"></span></div>
      <div class="bar"><div class="bar-fill" style="width:100%"></div></div>
    `;
    headRow.appendChild(th);
    const nameInput = th.querySelector('.team-name');
    nameInput.value = state.teams[c].name;
    nameInput.addEventListener('input', ()=>{
      state.teams[c].name = nameInput.value;
      save();
    });
    teamNameInputs.push(nameInput);
    budgetAmtEls.push(th.querySelector('.budget-amt'));
    budgetSubEls.push(th);
    barFillEls.push(th.querySelector('.bar-fill'));
  }

  // ---------- build body ----------
  const tbody = document.getElementById('board-body');
  const playerInputs = []; // [row][col]
  const priceInputs = [];
  const cellEls = [];

  for(let r=0;r<NUM_PICKS;r++){
    const tr = document.createElement('tr');
    const pickTd = document.createElement('td');
    pickTd.className = 'pickcol';
    pickTd.textContent = (r+1);
    tr.appendChild(pickTd);

    playerInputs.push([]);
    priceInputs.push([]);
    cellEls.push([]);

    for(let c=0;c<NUM_TEAMS;c++){
      const td = document.createElement('td');
      td.className = 'cell';
      td.innerHTML = `
        <div class="cell-inner">
          <div class="player-wrap">
            <input class="player-input" type="text" placeholder="Player..." autocomplete="off" data-r="${r}" data-c="${c}">
          </div>
          <input class="price-input" type="number" placeholder="$" min="0" step="1" data-r="${r}" data-c="${c}">
          <button class="clear-x" title="Clear pick" data-r="${r}" data-c="${c}">&times;</button>
        </div>
      `;
      tr.appendChild(td);

      const pick = state.picks[r][c];
      const pInput = td.querySelector('.player-input');
      const priceInput = td.querySelector('.price-input');
      const clearBtn = td.querySelector('.clear-x');

      pInput.value = pick.player;
      pInput.dataset.lastGood = pick.player || '';
      priceInput.value = pick.price;

      pInput.addEventListener('input', ()=>{
        state.picks[r][c].player = pInput.value;
        state.picks[r][c].pos = '';
        state.picks[r][c].team = '';
        save();
        renderSuggestions(r,c,pInput);
        refreshAll();
      });
      pInput.addEventListener('focus', ()=>renderSuggestions(r,c,pInput));
      pInput.addEventListener('keydown', (e)=>handleKeydown(e,r,c,pInput));
      pInput.addEventListener('blur', ()=>{
        setTimeout(()=>{
          hideSuggestions();
          validateCell(r,c,pInput);
        }, 220);
      });

      priceInput.addEventListener('input', ()=>{
        const v = priceInput.value;
        state.picks[r][c].price = v === '' ? '' : Number(v);
        save();
        refreshAll();
      });

      clearBtn.addEventListener('click', ()=>{
        state.picks[r][c] = {player:'',pos:'',team:'',price:''};
        pInput.value=''; pInput.dataset.lastGood=''; priceInput.value='';
        save();
        refreshAll();
      });

      playerInputs[r].push(pInput);
      priceInputs[r].push(priceInput);
      cellEls[r].push(td);
    }
    tbody.appendChild(tr);
  }

  // ---------- suggestions ----------
  const suggestPanel = document.getElementById('suggest-panel');
  let activeCell = null; // {r,c,input}
  let activeIndex = -1;
  let currentMatches = [];

  function draftedElsewhereMap(){
    const map = new Map(); // lowercase name -> {r,c}
    for(let r=0;r<NUM_PICKS;r++){
      for(let c=0;c<NUM_TEAMS;c++){
        const nm = (state.picks[r][c].player||'').trim().toLowerCase();
        if(nm) map.set(nm, {r,c});
      }
    }
    return map;
  }

  function renderSuggestions(r,c,input){
    activeCell = {r,c,input};
    const query = input.value.trim().toLowerCase();
    const takenMap = draftedElsewhereMap();

    // Players already drafted by any other cell are removed from the pool entirely.
    const available = PLAYERS.filter(p=>{
      const takenAt = takenMap.get(p.name.toLowerCase());
      const isTakenElsewhere = takenAt && !(takenAt.r===r && takenAt.c===c);
      return !isTakenElsewhere;
    });

    let matches;
    if(query === ''){
      matches = available.slice(0,40);
    } else {
      matches = available.filter(p => p.name.toLowerCase().includes(query));
      matches.sort((a,b)=>{
        const ai = a.name.toLowerCase().indexOf(query);
        const bi = b.name.toLowerCase().indexOf(query);
        if(ai !== bi) return ai-bi;
        return a.name.length - b.name.length;
      });
      matches = matches.slice(0,40);
    }
    currentMatches = matches;
    activeIndex = -1;

    const rect = input.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    const panelWidth = Math.max(rect.width, 230);
    let left = rect.left;
    if(left + panelWidth > vw - 8) left = Math.max(8, vw - panelWidth - 8);
    if(left < 8) left = 8;

    const spaceBelow = vh - rect.bottom;
    const spaceAbove = rect.top;
    const maxPanelH = 280;
    let top, maxHeight;
    if(spaceBelow >= 160 || spaceBelow >= spaceAbove){
      top = rect.bottom + 4;
      maxHeight = Math.min(maxPanelH, Math.max(120, vh - top - 8));
    } else {
      maxHeight = Math.min(maxPanelH, Math.max(120, spaceAbove - 8));
      top = Math.max(8, rect.top - 4 - maxHeight);
    }

    suggestPanel.style.left = left + 'px';
    suggestPanel.style.top = top + 'px';
    suggestPanel.style.width = panelWidth + 'px';
    suggestPanel.style.maxHeight = maxHeight + 'px';

    if(matches.length === 0){
      const existsButTaken = query !== '' && PLAYERS.some(p => p.name.toLowerCase().includes(query));
      suggestPanel.innerHTML = existsButTaken
        ? `<div class="sg-empty">Already drafted — no available players match.</div>`
        : `<div class="sg-empty">No matches — this will be saved as free text.</div>`;
    } else {
      suggestPanel.innerHTML = matches.map((p,i)=>{
        return `<div class="sg-item" data-idx="${i}">
          <span class="pos-badge pos-${p.pos}">${p.pos}</span>
          <span class="sg-name">${escapeHtml(p.name)}</span>
          <span class="sg-meta">${p.team}</span>
        </div>`;
      }).join('');
    }
    suggestPanel.style.display = 'block';

    suggestPanel.querySelectorAll('.sg-item').forEach(el=>{
      // Use 'click' (not 'mousedown') so the browser's own tap-vs-scroll
      // detection applies — this is what makes tapping reliable on touch
      // screens even with a bit of natural finger movement.
      el.addEventListener('click', (e)=>{
        e.preventDefault();
        const idx = Number(el.getAttribute('data-idx'));
        selectMatch(idx);
      });
    });
  }

  function validateCell(r,c,input){
    const val = input.value.trim();
    if(val === ''){
      input.dataset.lastGood = '';
      return;
    }
    const lower = val.toLowerCase();
    let dupAt = null;
    outer:
    for(let rr=0; rr<NUM_PICKS; rr++){
      for(let cc=0; cc<NUM_TEAMS; cc++){
        if(rr===r && cc===c) continue;
        const nm = (state.picks[rr][cc].player||'').trim().toLowerCase();
        if(nm && nm === lower){ dupAt = {r:rr,c:cc}; break outer; }
      }
    }
    if(dupAt){
      showToast(`${val} is already drafted by ${state.teams[dupAt.c].name} (Pick ${dupAt.r+1}) — pick someone else.`);
      const prev = input.dataset.lastGood || '';
      input.value = prev;
      const prevMatch = PLAYERS.find(p => p.name.toLowerCase() === prev.trim().toLowerCase());
      state.picks[r][c] = prev
        ? {player:prev, pos: prevMatch?prevMatch.pos:'', team: prevMatch?prevMatch.team:'', price: state.picks[r][c].price}
        : {player:'', pos:'', team:'', price: state.picks[r][c].price};
      save();
      refreshAll();
      return;
    }
    input.dataset.lastGood = val;
    if(!state.picks[r][c].pos){
      const exact = PLAYERS.find(p => p.name.toLowerCase() === lower);
      if(exact){
        state.picks[r][c].pos = exact.pos;
        state.picks[r][c].team = exact.team;
        save();
        refreshAll();
      }
    }
  }

  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>{ el.classList.remove('show'); }, 3200);
  }

  function hideSuggestions(){
    suggestPanel.style.display = 'none';
    activeCell = null;
    activeIndex = -1;
    currentMatches = [];
  }

  function selectMatch(idx){
    if(!activeCell) return;
    const p = currentMatches[idx];
    if(!p) return;
    const {r,c,input} = activeCell;
    input.value = p.name;
    input.dataset.lastGood = p.name;
    state.picks[r][c].player = p.name;
    state.picks[r][c].pos = p.pos;
    state.picks[r][c].team = p.team;
    save();
    hideSuggestions();
    refreshAll();
    priceInputs[r][c].focus();
  }

  function handleKeydown(e,r,c,input){
    if(suggestPanel.style.display !== 'block') {
      if(e.key === 'ArrowDown'){ renderSuggestions(r,c,input); }
      return;
    }
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      activeIndex = Math.min(activeIndex+1, currentMatches.length-1);
      highlightActive();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      activeIndex = Math.max(activeIndex-1, 0);
      highlightActive();
    } else if(e.key === 'Enter'){
      e.preventDefault();
      if(activeIndex >= 0){ selectMatch(activeIndex); }
      else { hideSuggestions(); priceInputs[r][c].focus(); }
    } else if(e.key === 'Escape'){
      hideSuggestions();
    }
  }

  function highlightActive(){
    const items = suggestPanel.querySelectorAll('.sg-item');
    items.forEach((el,i)=>{
      el.classList.toggle('active', i===activeIndex);
      if(i===activeIndex) el.scrollIntoView({block:'nearest'});
    });
  }

  // Ignore scroll events that originate *inside* the suggestion panel itself —
  // otherwise trying to scroll through the player list on a touch screen
  // would immediately close the dropdown before a selection could be made.
  document.addEventListener('scroll', (e)=>{
    if(activeCell && !(suggestPanel.contains(e.target))) hideSuggestions();
  }, true);

  // On mobile, opening the on-screen keyboard fires a resize (or
  // visualViewport resize) event. Reposition the panel instead of hiding it,
  // so it doesn't vanish right as the keyboard appears.
  function repositionOrHide(){
    if(!activeCell) return;
    renderSuggestions(activeCell.r, activeCell.c, activeCell.input);
  }
  window.addEventListener('resize', repositionOrHide);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', repositionOrHide);
    window.visualViewport.addEventListener('scroll', repositionOrHide);
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  // ---------- refresh budgets / dup highlighting / stats ----------
  function refreshAll(){
    // duplicate detection
    const nameCount = new Map();
    for(let r=0;r<NUM_PICKS;r++){
      for(let c=0;c<NUM_TEAMS;c++){
        const nm = (state.picks[r][c].player||'').trim().toLowerCase();
        if(!nm) continue;
        nameCount.set(nm, (nameCount.get(nm)||0)+1);
      }
    }

    let totalDrafted = 0, totalSpent = 0;

    for(let c=0;c<NUM_TEAMS;c++){
      let spent = 0, filled = 0;
      for(let r=0;r<NUM_PICKS;r++){
        const pick = state.picks[r][c];
        const hasPlayer = (pick.player||'').trim() !== '';
        const price = Number(pick.price)||0;
        if(hasPlayer){ filled++; spent += price; totalDrafted++; totalSpent += price; }

        const nm = (pick.player||'').trim().toLowerCase();
        const isDup = nm && nameCount.get(nm) > 1;
        cellEls[r][c].classList.toggle('filled', hasPlayer);
        cellEls[r][c].classList.toggle('dup', !!isDup);
        cellEls[r][c].title = isDup ? 'This player appears more than once on the board' : '';

        POS_LIST.forEach(pos => cellEls[r][c].classList.remove('cell-' + pos));
        if(hasPlayer && pick.pos && POS_LIST.includes(pick.pos)){
          cellEls[r][c].classList.add('cell-' + pick.pos);
        }

        // position badge prefix in the input's sibling (visual only via title)
        playerInputs[r][c].style.borderColor = isDup ? 'var(--red)' : '';
      }
      const remaining = BUDGET - spent;
      const openSlots = NUM_PICKS - filled;
      const maxBid = openSlots > 0 ? remaining - (openSlots - 1) : remaining;

      budgetAmtEls[c].textContent = '$' + remaining;
      budgetAmtEls[c].style.color = remaining < 0 ? 'var(--red)' : (remaining < 30 ? 'var(--red)' : (remaining < 100 ? 'var(--amber)' : 'var(--green)'));

      const subEl = budgetSubEls[c];
      subEl.querySelector('.filled-count').textContent = filled + '/' + NUM_PICKS + ' filled';
      subEl.querySelector('.max-bid').textContent = openSlots > 0 ? ('Max bid: $' + Math.max(maxBid,0)) : '';

      const pct = Math.max(0, Math.min(100, (remaining/BUDGET)*100));
      barFillEls[c].style.width = pct + '%';
      barFillEls[c].style.background = remaining < 0 ? 'var(--red)' : (remaining < 30 ? 'var(--red)' : (remaining < 100 ? 'var(--amber)' : 'var(--green)'));
    }

    document.getElementById('stat-drafted').textContent = totalDrafted;
    document.getElementById('stat-spent').textContent = '$' + totalSpent;
    document.getElementById('stat-avg').textContent = '$' + (totalDrafted ? Math.round(totalSpent/totalDrafted) : 0);
    document.getElementById('stat-pool').textContent = Math.max(0, PLAYERS.length - totalDrafted);
  }

  // ---------- reset / export ----------
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    if(!confirm('Reset the entire draft board? This clears all picks, prices, and team names.')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });

  document.getElementById('btn-export').addEventListener('click', ()=>{
    const rows = [['Pick', ...state.teams.map(t=>t.name)]];
    for(let r=0;r<NUM_PICKS;r++){
      const row = [String(r+1)];
      for(let c=0;c<NUM_TEAMS;c++){
        const p = state.picks[r][c];
        row.push(p.player ? `${p.player} ($${p.price||0})` : '');
      }
      rows.push(row);
    }
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'auction_draft_board.csv';
    a.click();
  });

  refreshAll();
})();
</script>
</body>
</html>
